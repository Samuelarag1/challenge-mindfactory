<div class="app-shell">
  <mat-toolbar class="app-toolbar">
    <div class="brand-block">
      <button
        mat-stroked-button
        routerLink="/vehicles"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        type="button"
      >
        Listado
      </button>
    </div>

    <nav class="toolbar-actions">
      <button mat-flat-button routerLink="/vehicles/new" routerLinkActive="is-active" type="button">
        Nuevo automotor
      </button>
    </nav>
  </mat-toolbar>

  <main class="app-content">
    <router-outlet />
  </main>
</div>
