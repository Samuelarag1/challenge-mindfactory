<a class="skip-link" href="#main-content">Saltar al contenido</a>

<div class="app-shell">
  <mat-toolbar class="app-toolbar">
    <div class="brand-block">
      <a class="app-title" routerLink="/vehicles">Registro automotor</a>
    </div>

    <nav class="toolbar-actions" aria-label="Navegacion principal">
      <button
        mat-stroked-button
        routerLink="/vehicles"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        type="button"
      >
        Listado
      </button>
      <button
        mat-flat-button
        routerLink="/vehicles/new"
        routerLinkActive="is-active"
        type="button"
      >
        Nuevo automotor
      </button>
    </nav>
  </mat-toolbar>

  <main id="main-content" class="app-content" tabindex="-1">
    <router-outlet />
  </main>
</div>
